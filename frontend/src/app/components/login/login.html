<div class="login-container">
  <div class="login-card">
    <!-- En-tête -->
    <div class="login-header">
      <div class="clinic-logo">
        🏥
      </div>
      <h1>Espace Professionnel</h1>
      <p class="subtitle">Centre Médical Excellence</p>
    </div>

    <!-- Compte de démonstration -->
    <div class="demo-section">
      <h3>Accès Rapide</h3>
      <button type="button" (click)="fillDemoAccount(demoAccounts[0])" class="demo-button">
        <span class="demo-icon">👩‍💼</span>
        <div class="demo-info">
          <div class="demo-role">Secrétaire Médicale</div>
          <div class="demo-email">secretaire@clinique.com</div>
        </div>
      </button>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <!-- Email -->
      <div class="form-group">
        <label for="email" class="form-label required">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="email@clinique.com"
          [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >
        <div class="error-message" *ngIf="getEmailError()">
          {{ getEmailError() }}
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <label for="password" class="form-label required">Mot de passe</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="Votre mot de passe"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
        <div class="error-message" *ngIf="getPasswordError()">
          {{ getPasswordError() }}
        </div>
      </div>

      <!-- Erreur -->
      <div *ngIf="error" class="alert-error">
        {{ error }}
      </div>

      <!-- Bouton de soumission -->
      <button 
        type="submit" 
        class="submit-button"
        [disabled]="loginForm.invalid || loading"
      >
        <span *ngIf="!loading">Se connecter</span>
        <span *ngIf="loading">Connexion...</span>
      </button>
    </form>

    <!-- Pied de page -->
    <div class="login-footer">
      <div class="password-hint">
        <strong>Mot de passe :</strong> password123
      </div>
      <div class="contact-info">
        <p>Assistance technique : 01 23 45 67 89</p>
        <p>support@clinique-excellence.fr</p>
      </div>
    </div>
  </div>
</div>
