<div class="facture-form">
  <h2>Nouvelle Facture</h2>

  <form [formGroup]="factureForm" (ngSubmit)="onSubmit()">
    
    <!-- Patient -->
    <div class="form-group">
      <label>Patient *</label>
      <select formControlName="patientId" (change)="onPatientSelection()">
        <option value="">Choisir un patient</option>
        <option *ngFor="let patient of patients" [value]="patient.idpatient">
          {{ patient.prenom }} {{ patient.nom }}
        </option>
      </select>
    </div>

    <!-- Nom Patient -->
    <div class="form-group">
      <label>Nom du Patient *</label>
      <input type="text" formControlName="patientNom" readonly>
    </div>

    <!-- Date -->
    <div class="form-group">
      <label>Date *</label>
      <input type="date" formControlName="dateCreation">
    </div>

    <!-- Montant -->
    <div class="form-group">
      <label>Montant (€) *</label>
      <input type="number" formControlName="montant" min="0" step="0.01">
    </div>

    <!-- Statut -->
    <div class="form-group">
      <label>Statut *</label>
      <select formControlName="statut">
        <option value="en attente">En attente</option>
        <option value="payée">Payée</option>
        <option value="annulée">Annulée</option>
        <option value="en retard">En retard</option>
      </select>
    </div>

    <!-- Consultation -->
    <div class="form-group">
      <label>Consultation *</label>
      <input type="text" formControlName="consultation" placeholder="Description de la consultation">
    </div>

    <!-- Médicament -->
    <div class="form-group">
      <label>Médicament</label>
      <input type="text" formControlName="medicament" placeholder="Nom du médicament">
    </div>

    <!-- Note -->
    <div class="form-group">
      <label>Note</label>
      <textarea formControlName="note" rows="3" placeholder="Notes supplémentaires..."></textarea>
    </div>

    <!-- Boutons -->
    <div class="actions">
      <button type="button" (click)="router.navigate(['/factures'])">Annuler</button>
      <button type="submit" [disabled]="!factureForm.valid">Créer Facture</button>
    </div>

  </form>
</div>
